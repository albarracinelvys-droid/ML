[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tetouan-power-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pytabkit==1.8.0", "pandas", "scikit-learn", "matplotlib", "joblib", "streamlit"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
